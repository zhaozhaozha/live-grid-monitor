name: Build Windows Installer

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      node_version:
        description: '打包进安装包的 Node 运行时版本'
        required: false
        default: '22.14.0'
      version:
        description: '安装包版本号（tag 触发时自动取 tag 名）'
        required: false
        default: '1.0.0'

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        shell: bash

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 准备 Node
        uses: actions/setup-node@v4
        with:
          node-version: '22.14.0'

      - name: 安装依赖
        run: npm install --no-audit --no-fund

      - name: 构建前端
        run: npm run build

      - name: 组装 payload
        run: bash installer/build-payload.sh "${{ github.event.inputs.node_version || '22.14.0' }}"

      - name: 校验 payload 完整性
        run: |
          echo "==> 关键文件检查"
          missing=0
          check() {
            if [ -f "$1" ]; then
              echo "  OK   $1"
            else
              echo "  MISS $1"
              missing=1
            fi
          }
          check installer/payload/runtime/node.exe
          check installer/payload/app/server/src/index.js
          check installer/payload/app/server/node_modules/ffmpeg-static/ffmpeg.exe
          check installer/payload/app/web/dist/index.html
          check installer/payload/start-silent.vbs
          check installer/payload/stop.vbs
          check installer/payload/assets/app.ico
          check installer/payload/app/server/.env
          if [ "$missing" -ne 0 ]; then
            echo "::error::payload 缺少关键文件，终止构建"
            exit 1
          fi
          echo "==> Node 运行时版本"
          installer/payload/runtime/node.exe --version

      - name: 编译安装包（Inno Setup）
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) {
            Write-Host "未预装 Inno Setup，正在安装..."
            choco install innosetup -y --no-progress --force
            $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          }
          if (-not (Test-Path $iscc)) {
            throw "找不到 ISCC.exe，无法编译安装包"
          }

          # 版本号：tag 触发时取 tag 名（去掉 v 前缀），否则回落到输入值或 1.0.0
          $version = "1.0.0"
          if ($env:GITHUB_REF -match '^refs/tags/v(.+)$') {
            $version = $Matches[1]
          } elseif ("${{ github.event.inputs.version }}") {
            $version = "${{ github.event.inputs.version }}"
          }
          Write-Host "安装包版本: $version"

          Write-Host "使用: $iscc"
          & $iscc "/DMyAppVersion=$version" "$PWD\installer\windows-setup.iss"
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup 编译失败" }

      - name: 列出产物
        run: ls -lh installer/output/

      - name: 安装冒烟测试（静默安装 → 启动 → 健康检查）
        shell: pwsh
        run: |
          $setup = (Get-ChildItem installer\output\*.exe | Select-Object -First 1).FullName
          $installDir = Join-Path $env:LOCALAPPDATA "LGM-SmokeTest"

          Write-Host "==> 静默安装到 $installDir"
          $p = Start-Process -FilePath $setup `
            -ArgumentList "/VERYSILENT","/NORESTART","/SUPPRESSMSGBOXES","/DIR=`"$installDir`"" `
            -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "静默安装失败，退出码 $($p.ExitCode)" }

          Write-Host "==> 检查安装后的文件"
          $missing = @()
          foreach ($f in @(
            "runtime\node.exe",
            "app\server\src\index.js",
            "app\server\node_modules\ffmpeg-static\ffmpeg.exe",
            "app\web\dist\index.html",
            "start-silent.vbs",
            "stop.vbs",
            "assets\app.ico",
            "app\server\.env"
          )) {
            $full = Join-Path $installDir $f
            if (Test-Path $full) { Write-Host "  OK   $f" }
            else { Write-Host "  MISS $f"; $missing += $f }
          }
          if ($missing.Count -gt 0) { throw "安装后缺少文件: $($missing -join ', ')" }

          Write-Host "==> 检查桌面快捷方式"
          $lnk = @()
          foreach ($d in @("$env:PUBLIC\Desktop", "$env:USERPROFILE\Desktop")) {
            if (Test-Path $d) {
              $lnk += Get-ChildItem $d -Filter "*.lnk" -ErrorAction SilentlyContinue |
                      Where-Object { $_.Name -like "*Live Grid Monitor*" }
            }
          }
          if ($lnk.Count -eq 0) { throw "未找到桌面快捷方式" }
          Write-Host "  桌面快捷方式: $($lnk[0].FullName)"

          Write-Host "==> 数据库驱动与运行时探测"
          if (Test-Path (Join-Path $installDir "app\server\node_modules\better-sqlite3")) {
            Write-Host "  better-sqlite3 已安装，将优先使用它"
          } else {
            Write-Host "  better-sqlite3 未安装，将依赖内置 node:sqlite"
          }
          $probe = & $node -e "try{const s=require('node:sqlite');console.log('node:sqlite OK: '+Object.keys(s).join(','))}catch(e){console.log('node:sqlite FAIL: '+e.message)}" 2>&1
          Write-Host "  $probe"

          Write-Host "==> 启动服务并做健康检查"
          $node  = Join-Path $installDir "runtime\node.exe"
          $entry = Join-Path $installDir "app\server\src\index.js"
          $outLog = Join-Path $env:RUNNER_TEMP "lgm-out.log"
          $errLog = Join-Path $env:RUNNER_TEMP "lgm-err.log"
          $svc = Start-Process -FilePath $node -ArgumentList "`"$entry`"" `
                   -WorkingDirectory $installDir -PassThru -WindowStyle Hidden `
                   -RedirectStandardOutput $outLog -RedirectStandardError $errLog
          try {
            Start-Sleep -Seconds 10
            $health = Invoke-WebRequest -Uri "http://localhost:8787/api/health" -UseBasicParsing -TimeoutSec 20
            Write-Host "  /api/health → $($health.Content)"
            if ($health.Content -notmatch '"ok":true') { throw "健康检查未返回 ok" }

            $page = Invoke-WebRequest -Uri "http://localhost:8787/" -UseBasicParsing -TimeoutSec 20
            Write-Host "  前端页面 → HTTP $($page.StatusCode)，$($page.Content.Length) bytes"
            if ($page.Content -notmatch 'id="root"') { throw "前端页面缺少 #root 挂载点" }
          } catch {
            Write-Host "=== 服务 stdout ==="
            if (Test-Path $outLog) { Get-Content $outLog }
            Write-Host "=== 服务 stderr ==="
            if (Test-Path $errLog) { Get-Content $errLog }
            throw
          } finally {
            Stop-Process -Id $svc.Id -Force -ErrorAction SilentlyContinue
          }

          Write-Host "==> 冒烟测试通过"

      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: LiveGridMonitor-Setup
          path: installer/output/*.exe
          if-no-files-found: error

      - name: 发布到 Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: installer/output/*.exe
          generate_release_notes: true
