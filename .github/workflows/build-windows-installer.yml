name: Build Windows Installer

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      node_version:
        description: '打包进安装包的 Node 运行时版本'
        required: false
        default: '22.14.0'

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        shell: bash

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 准备 Node
        uses: actions/setup-node@v4
        with:
          node-version: '22.14.0'

      - name: 安装依赖
        run: npm install --no-audit --no-fund

      - name: 构建前端
        run: npm run build

      - name: 组装 payload
        run: bash installer/build-payload.sh "${{ github.event.inputs.node_version || '22.14.0' }}"

      - name: 校验 payload 完整性
        run: |
          echo "==> 关键文件检查"
          missing=0
          check() {
            if [ -f "$1" ]; then
              echo "  OK   $1"
            else
              echo "  MISS $1"
              missing=1
            fi
          }
          check payload/runtime/node.exe
          check payload/app/server/src/index.js
          check payload/app/server/node_modules/ffmpeg-static/ffmpeg.exe
          check payload/app/web/dist/index.html
          check payload/start-silent.vbs
          check payload/stop.vbs
          check payload/assets/app.ico
          check payload/app/server/.env
          if [ "$missing" -ne 0 ]; then
            echo "::error::payload 缺少关键文件，终止构建"
            exit 1
          fi
          echo "==> Node 运行时版本"
          payload/runtime/node.exe --version

      - name: 编译安装包（Inno Setup）
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) {
            Write-Host "未预装 Inno Setup，正在安装..."
            choco install innosetup -y --no-progress --force
            $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          }
          if (-not (Test-Path $iscc)) {
            throw "找不到 ISCC.exe，无法编译安装包"
          }
          Write-Host "使用: $iscc"
          & $iscc "$PWD\installer\windows-setup.iss"
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup 编译失败" }

      - name: 列出产物
        run: ls -lh installer/output/

      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: LiveGridMonitor-Setup
          path: installer/output/*.exe
          if-no-files-found: error

      - name: 发布到 Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: installer/output/*.exe
          generate_release_notes: true
